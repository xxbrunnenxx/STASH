[project]
name = "stash-brain"
version = "0.1.0"
description = "STASH — Sprachnotizen transkribieren, einsortieren, in einen Obsidian-Vault schreiben"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "httpx>=0.27",
  "caldav>=1.3",
]

[project.scripts]
stash-brain     = "stash.server:hauptprogramm"
stash-nachtlauf = "stash.nachtlauf:hauptprogramm"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stash*"]
